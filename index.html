<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asad's GenAI Learning Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--surface:#12121a;--surface2:#1a1a26;--border:#2a2a3a;--text:#e8e8f0;--text-dim:#7a7a8e;--accent:#00f0ff;--accent2:#7b61ff;--accent3:#ff6b9d;--done:#00e676;
--p1:#00f0ff;--p2:#7b61ff;--p3:#ff6b9d;--p4:#ffd700}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Space Mono',monospace;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 0%,rgba(0,240,255,0.06),transparent 50%),radial-gradient(ellipse at 80% 100%,rgba(123,97,255,0.06),transparent 50%);pointer-events:none;z-index:0}
.w{max-width:1100px;margin:0 auto;position:relative;z-index:1}
.greeting{padding:2.5rem 2rem 0.5rem;text-align:center}
.greeting h1{font-family:'Syne',sans-serif;font-weight:800;font-size:1.6rem;letter-spacing:-1px;animation:ti 1s cubic-bezier(0.16,1,0.3,1) both}
@keyframes ti{0%{opacity:0;transform:translateY(20px) scale(0.95);filter:blur(8px)}100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
.greeting h1 .name{background:linear-gradient(135deg,var(--accent),var(--accent2),var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-size:200% 200%;animation:ti 1s cubic-bezier(0.16,1,0.3,1) both,sh 4s ease-in-out infinite 1s}
@keyframes sh{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.greeting .tagline{color:var(--text-dim);font-size:0.7rem;margin-top:0.3rem;letter-spacing:1px;animation:fs 0.8s 0.3s both}
.greeting .motivation{margin-top:0.6rem;font-size:0.75rem;color:var(--text-dim);line-height:1.6;max-width:700px;margin-left:auto;margin-right:auto;animation:fs 0.8s 0.5s both}
@keyframes fs{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
.greeting .motivation span{color:var(--accent)}
.lock-banner{background:rgba(255,107,157,0.1);border:1px solid rgba(255,107,157,0.3);border-radius:10px;padding:0.6rem 1rem;margin:0.5rem 2rem;text-align:center;font-size:0.65rem;color:var(--accent3);display:none}.lock-banner.show{display:block}
.stats-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:0.5rem;padding:1rem 2rem}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:0.6rem 0.8rem;transition:border-color 0.3s}.stat-card:hover{border-color:var(--accent)}
.stat-label{font-size:0.45rem;text-transform:uppercase;letter-spacing:2px;color:var(--text-dim)}
.stat-value{font-family:'Syne',sans-serif;font-weight:800;font-size:1.4rem;margin-top:0.05rem}
.c1{color:var(--p1)}.c2{color:var(--p2)}.c3{color:var(--p3)}.c4{color:var(--p4)}.cw{color:var(--text)}.cg{color:var(--done)}
.tl-section{padding:0.8rem 2rem}
.tl-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.2rem 1.4rem}
.tl-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.4rem;margin-bottom:0.8rem}
.tl-title{font-family:'Syne',sans-serif;font-weight:700;font-size:0.9rem}
.tl-dates{font-size:0.6rem;color:var(--text-dim)}.tl-dates span{color:var(--accent);font-weight:700}
.meter{height:10px;background:var(--surface2);border-radius:5px;position:relative;margin-bottom:0.4rem;overflow:visible}
.meter-fill{height:100%;border-radius:5px;transition:width 0.6s cubic-bezier(0.22,1,0.36,1);background:linear-gradient(90deg,var(--p1),var(--p2),var(--p3),var(--p4))}
.meter-fill::after{content:'';position:absolute;right:0;top:-1px;bottom:-1px;width:3px;background:#fff;border-radius:2px;box-shadow:0 0 8px #fff}
.meter-today{position:absolute;top:-4px;width:2px;height:18px;background:var(--accent3);border-radius:1px;transition:left 0.6s;z-index:2}
.meter-today::after{content:'today';position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-size:0.4rem;color:var(--accent3);letter-spacing:1px;text-transform:uppercase;white-space:nowrap}
.meter-gifts{display:flex;position:relative;height:22px;margin-bottom:0.3rem}
.meter-gift{position:absolute;transform:translateX(-50%);cursor:pointer;font-size:1.1rem;transition:transform 0.2s;filter:drop-shadow(0 0 4px rgba(0,240,255,0.3))}.meter-gift:hover{transform:translateX(-50%) scale(1.3)}.meter-gift.locked{opacity:0.25;filter:none}
.tl-stats{display:flex;gap:1.2rem;flex-wrap:wrap}
.ts{display:flex;flex-direction:column}.ts-v{font-family:'Syne',sans-serif;font-weight:800;font-size:1rem}.ts-l{font-size:0.45rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:1.5px;margin-top:0.05rem}
.pace-section{padding:0.6rem 2rem}
.pace-card{background:linear-gradient(135deg,rgba(123,97,255,0.06),rgba(255,107,157,0.06));border:1px solid rgba(123,97,255,0.2);border-radius:14px;padding:1rem 1.4rem}
.pace-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.4rem;margin-bottom:0.6rem}
.pace-title{font-family:'Syne',sans-serif;font-weight:700;font-size:0.8rem}
.pace-val{font-family:'Syne',sans-serif;font-weight:800;font-size:1.2rem;color:var(--accent2)}
input[type=range]{width:100%;-webkit-appearance:none;height:6px;border-radius:3px;background:var(--surface2);outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--accent2);cursor:pointer;border:3px solid var(--bg);box-shadow:0 0 10px rgba(123,97,255,0.3)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--accent2);cursor:pointer;border:3px solid var(--bg)}
.pace-chips{display:flex;gap:0.7rem;margin-top:0.6rem;flex-wrap:wrap}
.pchip{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:0.35rem 0.6rem;display:flex;flex-direction:column;align-items:center;min-width:65px}
.pchip strong{font-family:'Syne',sans-serif;font-size:0.9rem;color:var(--accent)}.pchip span{font-size:0.4rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-top:0.05rem}
.milestones{display:flex;gap:0.4rem;margin-top:0.6rem;flex-wrap:wrap}
.gift{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:0.3rem 0.5rem;font-size:0.55rem;display:flex;align-items:center;gap:0.25rem;transition:all 0.3s;cursor:pointer}
.gift.unlocked{border-color:var(--done);background:rgba(0,230,118,0.08)}.gift.locked{opacity:0.4}
.prog{padding:0.4rem 2rem}.prog-track{height:4px;background:var(--surface2);border-radius:2px;overflow:hidden;display:flex}
.prog-fill{height:100%;transition:width 0.6s cubic-bezier(0.22,1,0.36,1)}
.hero{padding:0.8rem 2rem}
.hero-card{background:linear-gradient(135deg,rgba(0,240,255,0.08),rgba(123,97,255,0.08));border:1px solid rgba(0,240,255,0.2);border-radius:14px;padding:1.2rem 1.3rem;position:relative;overflow:hidden}
.hero-badge{position:absolute;top:0.6rem;right:0.9rem;font-family:'Syne',sans-serif;font-weight:800;font-size:0.5rem;letter-spacing:3px;color:var(--accent);background:rgba(0,240,255,0.1);padding:0.2rem 0.5rem;border-radius:20px}
.hero-phase{font-size:0.45rem;text-transform:uppercase;letter-spacing:2px;color:var(--text-dim);margin-bottom:0.1rem}
.hero-title{font-family:'Syne',sans-serif;font-weight:700;font-size:1rem;padding-right:5rem}
.hero-dur{color:var(--text-dim);font-size:0.55rem;margin-top:0.25rem}
.hero-link{display:inline-block;margin-top:0.5rem;color:var(--accent);text-decoration:none;font-size:0.65rem;border:1px solid var(--accent);padding:0.35rem 0.9rem;border-radius:8px;transition:all 0.3s}.hero-link:hover{background:var(--accent);color:var(--bg)}
.hero-extra{margin-top:0.5rem;display:flex;flex-direction:column;gap:0.3rem}
.hero-extra-item{display:flex;align-items:center;gap:0.5rem;background:rgba(123,97,255,0.06);border:1px solid rgba(123,97,255,0.15);border-radius:8px;padding:0.35rem 0.6rem;transition:border-color 0.3s}.hero-extra-item:hover{border-color:var(--accent2)}
.hero-extra-item a{color:var(--accent2);font-size:0.6rem;text-decoration:none;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-ck{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;font-size:0.4rem;transition:all 0.3s}.mini-ck:hover{border-color:var(--done)}.mini-ck.on{background:var(--done);border-color:var(--done);color:var(--bg)}
.showcase{padding:1rem 2rem}
.showcase-title{font-family:'Syne',sans-serif;font-weight:800;font-size:1rem;margin-bottom:0.7rem;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.showcase-grid{display:flex;flex-direction:column;gap:0.7rem}
.project-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1rem 1.1rem;transition:border-color 0.3s;position:relative}.project-card:hover{border-color:var(--accent)}.project-card.has-link{border-color:var(--done)}
.project-card.has-link::after{content:'\2713 SHIPPED';position:absolute;top:0.7rem;right:0.9rem;font-family:'Syne',sans-serif;font-weight:800;font-size:0.45rem;letter-spacing:2px;color:var(--done);background:rgba(0,230,118,0.1);padding:0.15rem 0.5rem;border-radius:12px}
.pc-phase{font-size:0.45rem;text-transform:uppercase;letter-spacing:2px;margin-bottom:0.25rem}.pc-name{font-family:'Syne',sans-serif;font-weight:700;font-size:0.85rem;margin-bottom:0.15rem}
.pc-desc{font-size:0.6rem;color:var(--text-dim);line-height:1.5;margin-bottom:0.6rem}
.pc-input-row{display:flex;gap:0.4rem;align-items:center}
.pc-input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:0.45rem 0.6rem;color:var(--text);font-family:'Space Mono',monospace;font-size:0.6rem;outline:none;transition:border-color 0.3s}.pc-input:focus{border-color:var(--accent)}.pc-input::placeholder{color:var(--text-dim)}
.pc-save{background:var(--accent2);color:#fff;border:none;border-radius:8px;padding:0.45rem 0.7rem;font-family:'Space Mono',monospace;font-size:0.55rem;cursor:pointer;transition:opacity 0.3s;white-space:nowrap}.pc-save:hover{opacity:0.85}
.pc-saved-link{display:flex;align-items:center;gap:0.4rem;margin-top:0.35rem}.pc-saved-link a{color:var(--done);font-size:0.6rem;text-decoration:none;word-break:break-all}.pc-saved-link a:hover{text-decoration:underline}
.pc-remove{color:#884444;font-size:0.55rem;cursor:pointer;background:none;border:none;font-family:'Space Mono',monospace}.pc-remove:hover{color:#ff4444}
.filters{padding:0.7rem 2rem 0.3rem;display:flex;gap:0.3rem;flex-wrap:wrap}
.fbtn{background:var(--surface);border:1px solid var(--border);color:var(--text-dim);padding:0.25rem 0.7rem;border-radius:20px;cursor:pointer;font-family:'Space Mono',monospace;font-size:0.55rem;letter-spacing:1px;text-transform:uppercase;transition:all 0.3s}.fbtn:hover,.fbtn.on{color:var(--text);border-color:var(--accent)}.fbtn.on{background:rgba(0,240,255,0.1)}
.phase-sec{padding:0.4rem 2rem;animation:fu 0.4s ease both}
.phase-sec:nth-child(2){animation-delay:0.05s}.phase-sec:nth-child(3){animation-delay:0.1s}.phase-sec:nth-child(4){animation-delay:0.15s}
@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.ph-hdr{display:flex;align-items:center;gap:0.6rem;margin-bottom:0.4rem;cursor:pointer;padding:0.25rem 0}
.ph-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.ph-dot.p1{background:var(--p1);box-shadow:0 0 8px rgba(0,240,255,0.2)}.ph-dot.p2{background:var(--p2);box-shadow:0 0 8px rgba(123,97,255,0.2)}.ph-dot.p3{background:var(--p3);box-shadow:0 0 8px rgba(255,107,157,0.2)}.ph-dot.p4{background:var(--p4);box-shadow:0 0 8px rgba(255,215,0,0.2)}
.ph-name{font-family:'Syne',sans-serif;font-weight:700;font-size:0.85rem}.ph-cnt{font-size:0.5rem;color:var(--text-dim);margin-left:auto;letter-spacing:1px}
.ph-tog{color:var(--text-dim);font-size:0.6rem;transition:transform 0.3s;margin-left:0.2rem}.ph-tog.collapsed{transform:rotate(-90deg)}
.days{display:flex;flex-direction:column;gap:0.3rem;transition:max-height 0.4s ease,opacity 0.3s}.days.collapsed{max-height:0!important;opacity:0;overflow:hidden}
.di{display:grid;grid-template-columns:24px 1fr auto auto;align-items:center;gap:0.5rem;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:0.5rem 0.8rem;transition:all 0.3s;cursor:pointer}.di:hover{border-color:var(--accent);transform:translateX(3px)}
.di.done{opacity:0.4}.di.done .dt{text-decoration:line-through}.di.today{border-color:var(--accent);background:rgba(0,240,255,0.04)}
.ck{width:16px;height:16px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.3s;cursor:pointer;font-size:0.45rem}.ck:hover{border-color:var(--done)}.ck.on{background:var(--done);border-color:var(--done);color:var(--bg)}
.d-info{min-width:0}.dt{font-size:0.65rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dm{font-size:0.5rem;color:var(--text-dim);margin-top:0.03rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-arrow{font-size:0.55rem;color:var(--accent);opacity:0;transition:opacity 0.3s;text-decoration:none;padding:0.15rem}.di:hover .d-arrow{opacity:1}
.d-artemis{font-size:0.55rem;color:var(--p4);opacity:0.5;transition:opacity 0.3s;cursor:pointer;padding:0.15rem;background:none;border:none;font-family:'Space Mono',monospace}.di:hover .d-artemis{opacity:1}.d-artemis:hover{color:var(--accent)}
.pc-guide{background:rgba(255,215,0,0.1);border:1px solid rgba(255,215,0,0.3);color:var(--p4);border-radius:8px;padding:0.4rem 0.7rem;font-family:'Syne',sans-serif;font-weight:700;font-size:0.55rem;cursor:pointer;transition:all 0.3s;margin-top:0.5rem;display:inline-block}.pc-guide:hover{background:rgba(255,215,0,0.2);border-color:var(--p4)}
.notes-sec{margin-top:0.6rem;text-align:left}.notes-title{font-family:'Syne',sans-serif;font-weight:700;font-size:0.65rem;color:var(--accent);margin-bottom:0.3rem}.notes-list{display:flex;flex-direction:column;gap:0.25rem;margin-bottom:0.4rem}
.note-item{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:0.4rem 0.6rem;font-size:0.58rem;color:var(--text);line-height:1.5;display:flex;align-items:center;gap:0.5rem;cursor:pointer;transition:border-color 0.2s}.note-item:hover{border-color:var(--accent)}
.note-icon{font-size:0.9rem;flex-shrink:0}.note-info{flex:1;min-width:0}.note-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.note-meta{font-size:0.45rem;color:var(--text-dim);margin-top:0.05rem}
.note-actions{display:flex;gap:0.2rem;flex-shrink:0}
.note-btn{background:none;border:none;color:var(--text-dim);font-size:0.5rem;cursor:pointer;padding:0.1rem 0.2rem;font-family:'Space Mono',monospace;transition:color 0.2s}.note-btn:hover{color:var(--accent)}
.note-btn.del:hover{color:var(--accent3)}
.note-upload-row{display:flex;gap:0.3rem;align-items:center}.note-upload-label{background:var(--accent);color:var(--bg);border:none;border-radius:6px;padding:0.35rem 0.7rem;font-family:'Syne',sans-serif;font-weight:700;font-size:0.5rem;cursor:pointer;white-space:nowrap;display:inline-block}.note-upload-label:hover{opacity:0.85}
.note-upload-hint{font-size:0.45rem;color:var(--text-dim)}
.note-empty{font-size:0.5rem;color:var(--text-dim);font-style:italic;padding:0.2rem 0}
.streak{padding:1rem 2rem}.streak-title{font-family:'Syne',sans-serif;font-weight:700;font-size:0.75rem;margin-bottom:0.4rem}
.streak-grid{display:flex;gap:3px;flex-wrap:wrap}
.sd{width:11px;height:11px;border-radius:2px;background:var(--surface2);transition:all 0.3s;position:relative}.sd.done{background:var(--done)}.sd.today{border:1px solid var(--accent)}.sd.future{background:var(--surface)}
.sd:hover::after{content:attr(data-tip);position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);color:var(--text);padding:0.2rem 0.35rem;border-radius:4px;font-size:0.45rem;white-space:nowrap;z-index:10;pointer-events:none}
.reset-wrap{text-align:center;padding:0.5rem 0 2rem}.reset-btn{background:transparent;border:1px solid #3a2020;color:#884444;padding:0.25rem 0.7rem;border-radius:6px;cursor:pointer;font-family:'Space Mono',monospace;font-size:0.5rem;transition:all 0.3s}.reset-btn:hover{border-color:#ff4444;color:#ff4444}
/* CELEBRATIONS */
.cele-overlay{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.88);opacity:0;pointer-events:none;transition:opacity 0.4s;padding:1rem;overflow-y:auto}.cele-overlay.show{opacity:1;pointer-events:auto}
.cele-box{text-align:center;animation:pi 0.5s cubic-bezier(0.16,1,0.3,1) both;max-width:500px;width:100%;padding:1.2rem}
@keyframes pi{0%{opacity:0;transform:scale(0.5) translateY(30px)}100%{opacity:1;transform:scale(1) translateY(0)}}
.cele-emoji{font-size:3rem;animation:bn 0.6s ease infinite alternate}@keyframes bn{0%{transform:translateY(0)}100%{transform:translateY(-10px)}}
.cele-title{font-family:'Syne',sans-serif;font-weight:800;font-size:1.4rem;margin:0.3rem 0;background:linear-gradient(135deg,var(--accent),var(--accent2),var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.cele-sub{color:var(--text-dim);font-size:0.65rem;line-height:1.6;margin-bottom:0.6rem}.cele-sub strong{color:var(--text)}
.cele-skills{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:0.7rem 0.9rem;margin:0.6rem 0;text-align:left}
.cele-skills-title{font-family:'Syne',sans-serif;font-weight:700;font-size:0.65rem;color:var(--accent);margin-bottom:0.3rem}
.cele-skill-item{font-size:0.6rem;color:var(--text-dim);padding:0.15rem 0;line-height:1.5}.cele-skill-item span{color:var(--done)}
.cele-btn{background:var(--accent2);color:#fff;border:none;border-radius:10px;padding:0.5rem 1.2rem;font-family:'Syne',sans-serif;font-weight:700;font-size:0.7rem;cursor:pointer;transition:opacity 0.3s}.cele-btn:hover{opacity:0.85}
.cele-game-btn{background:linear-gradient(135deg,var(--accent),var(--accent3));color:var(--bg);border:none;border-radius:10px;padding:0.6rem 1.4rem;font-family:'Syne',sans-serif;font-weight:800;font-size:0.75rem;cursor:pointer;margin-top:0.4rem;animation:pu 1.5s ease infinite}
@keyframes pu{0%,100%{box-shadow:0 0 0 0 rgba(0,240,255,0.4)}50%{box-shadow:0 0 0 10px rgba(0,240,255,0)}}
canvas#confetti{position:fixed;inset:0;z-index:10000;pointer-events:none}
.game-modal{position:fixed;inset:0;z-index:10001;background:rgba(0,0,0,0.95);display:none;align-items:center;justify-content:center}.game-modal.show{display:flex}
.game-wrap{background:var(--surface);border:2px solid var(--accent);border-radius:16px;padding:1.2rem;max-width:400px;width:90%;text-align:center}
.game-title{font-family:'Syne',sans-serif;font-weight:800;font-size:0.9rem;color:var(--accent);margin-bottom:0.4rem}
.game-canvas{width:100%;aspect-ratio:1;background:var(--bg);border-radius:8px;border:1px solid var(--border);display:block;cursor:pointer}
.game-score{font-family:'Syne',sans-serif;font-weight:800;font-size:1.3rem;color:var(--accent3);margin:0.4rem 0}
.game-close{background:none;border:1px solid var(--border);color:var(--text-dim);border-radius:8px;padding:0.35rem 0.8rem;font-family:'Space Mono',monospace;font-size:0.55rem;cursor:pointer;margin-top:0.4rem}.game-close:hover{border-color:var(--accent);color:var(--text)}
.auth-modal{position:fixed;inset:0;z-index:10002;background:rgba(0,0,0,0.9);display:none;align-items:center;justify-content:center}.auth-modal.show{display:flex}

p1:{title:'\u{1F525} How to Build: Fine-tune Sentiment Model',steps:[
'\u2460 <b>Export training data</b> \u2014 Query Redshift for 2,600+ posts Rafeh labelled. Export as JSONL: {text, sentiment_label}. <i>(Uses: Day 15 HF pipelines, Day 16 Hub workflows)</i>',

'\u2465 <b>Push to HuggingFace</b> \u2014 model.push_to_hub("artemisai-sentiment"). Write model card: data source (ArtemisAI FB posts), metrics (Macro F1), intended use (Tier 1 pipeline), limitations (UK slang, sarcasm). <i>(Uses: Day 16 Hub workflows)</i>',

p2:{title:'\u{1F50D} How to Build: Art-E RAG Prototype',steps:[
'\u2460 <b>Embed posts</b> \u2014 Use sentence-transformers (all-MiniLM-L6-v2) on 111K captions. Create Pinecone index with metadata: page_id, date, engagement, sentiment_label, topic. <i>(Uses: Day 8 embeddings, Day 26-27 RAG from scratch)</i>',
'\u2461 <b>Build knowledge graph</b> \u2014 Neo4j: Page nodes \u2192 Post nodes \u2192 Topic nodes. Edges: posted_by, has_topic, similar_to (cosine >0.85). Import from Redshift dim_posts + NLP labels. <i>(Uses: Day 31-32 Knowledge Graphs for RAG)</i>',
'\u2462 <b>Hybrid retrieval router</b> \u2014 Semantic ("posts about fitness") \u2192 Pinecone. Structured ("Tuesday\'s top post") \u2192 Redshift SQL. Relationships ("compare niches") \u2192 Neo4j Cypher. <i>(Uses: Day 27 hybrid search, Day 29-30 agentic RAG)</i>',
'\u2463 <b>RAG pipeline</b> \u2014 LlamaIndex: query \u2192 IntentClassifier \u2192 route to right retriever \u2192 rerank with Cohere \u2192 augment prompt with citations \u2192 generate. <i>(Uses: Day 28 advanced RAG, Day 34 LlamaIndex)</i>',
'\u2464 <b>Evaluate (RAG triad)</b> \u2014 50 test queries from Knowledge Hub. Context Relevance: did we get the right posts? Groundedness: every number traceable to Redshift? Answer Relevance: does it actually answer? <i>(Uses: Day 28 RAG triad evaluation)</i>',

]},
p3:{title:'\u{1F916} How to Build: Art-E Agentic System',steps:[
'\u2460 <b>LangGraph state machine</b> \u2014 Nodes: QueryUnderstanding \u2192 ModelRouter \u2192 ToolSelector \u2192 ToolExecutor \u2192 ResponseAssembly \u2192 Stream. Conditional edges for complexity routing. <i>(Uses: Day 38-39 LangGraph agents)</i>',
'\u2461 <b>Build 5 MCP tools</b> \u2014 query_posts(date,sort) \u2192 Redshift SQL, get_engagement(period) \u2192 Redshift, predict_virality(text) \u2192 SageMaker, search_similar(post_id) \u2192 Pinecone, explain_post(id) \u2192 SHAP. <i>(Uses: Day 40 functions/tools, Day 44-45 MCP)</i>',
'\u2462 <b>Model router</b> \u2014 GPT-4o-mini for simple lookups (60%, ~$0.002/q). GPT-4 for complex analysis (25%, ~$0.03/q). Fine-tuned LLaMA 8B for patterns (15%, ~$0.001/q). Monthly cost at 100 pages: ~$15 with Redis caching. <i>(Uses: Day 39 conditional branching, Day 21 decision framework)</i>',
'\u2463 <b>Multi-agent proactive insights</b> \u2014 crewAI: SentimentAgent + EngagementAgent + ViralityAgent + AudienceAgent run parallel, SynthesisAgent combines \u2192 daily 8AM briefing (Sprint 20 VD-123). <i>(Uses: Day 41 crewAI multi-agent)</i>',
'\u2464 <b>Conversation memory</b> \u2014 DynamoDB: last 5 turns per user. "Last time you asked about posting times, I found Tuesday 6PM." Redis for session cache (1hr TTL for data, 24hr for explanations). <i>(Uses: Day 42-43 agent use cases)</i>',
'\u2465 <b>SSE streaming + deploy</b> \u2014 API Gateway \u2192 Lambda \u2192 SSE to React. Typewriter effect. Citations: [Source: post_labels, 2026-04-01]. Suggestion pills for follow-up questions. <i>(Uses: Day 51 AWS deploy)</i>',
]},
p4:{title:'\u{1F916} How to Build: Claude Agent for ArtemisAI',steps:[
'\u2460 <b>Install Claude Code</b> \u2014 npm install -g @anthropic-ai/claude-code. Set up CLAUDE.md with ArtemisAI coding standards, Redshift schema, and Art-E query patterns. <i>(Uses: Day 47 Claude Code + MCP)</i>',
'\u2461 <b>Build 3 MCP servers</b> \u2014 Redshift MCP (query_posts, get_engagement, get_sentiment), Pinecone MCP (search_similar, embed_post), SageMaker MCP (predict_virality, explain_post). Use Python MCP SDK. <i>(Uses: Day 44-45 MCP fundamentals + building)</i>',
'\u2462 <b>Create Claude Skills</b> \u2014 art-e-query-skill (understands ArtemisAI query types), art-e-analysis-skill (knows how to compare periods, find anomalies), art-e-report-skill (formats daily briefings). <i>(Uses: Day 48 Claude Skills + subagents)</i>',

function getNotes(){return ld(NK,{})}
function getFilesForDay(d){return getNotes()[d]||[]}
function fileIcon(name){const ext=(name.split('.').pop()||'').toLowerCase();if(['png','jpg','jpeg','gif','webp','svg'].includes(ext))return'\u{1F5BC}\uFE0F';if(['pdf'].includes(ext))return'\u{1F4C4}';if(['doc','docx'].includes(ext))return'\u{1F4DD}';if(['xls','xlsx','csv'].includes(ext))return'\u{1F4CA}';if(['py','js','ts','html','css','json','sql'].includes(ext))return'\u{1F4BB}';if(['zip','tar','gz'].includes(ext))return'\u{1F4E6}';if(['mp4','mov','webm'].includes(ext))return'\u{1F3AC}';return'\u{1F4CE}'}
function fmtSize(b){if(b<1024)return b+'B';if(b<1048576)return(b/1024).toFixed(1)+'KB';return(b/1048576).toFixed(1)+'MB'}
function handleFileUpload(day,input){requireAuth(()=>{if(!input.files||!input.files.length)return;const files=Array.from(input.files);files.forEach(file=>{const reader=new FileReader();reader.onload=function(e){const n=getNotes();if(!n[day])n[day]=[];n[day].push({name:file.name,size:file.size,type:file.type,data:e.target.result,ts:Date.now()});try{sv(NK,n);showArtemis(day)}catch(err){alert('File too large for browser storage. Try a smaller file or image.');n[day].pop()}};reader.readAsDataURL(file)});input.value=''})}
function removeFile(day,idx){requireAuth(()=>{const n=getNotes();if(n[day]){n[day].splice(idx,1);sv(NK,n)}showArtemis(day)})}
function openFileInBrowser(day,idx){const n=getNotes();const f=n[day]?.[idx];if(!f)return;const w=window.open('');if(f.type==='application/pdf'||f.name.endsWith('.pdf')){w.document.write(`<html><head><title>${f.name}</title></head><body style="margin:0"><iframe src="${f.data}" style="width:100%;height:100vh;border:none"></iframe></body></html>`)}else if(f.data.startsWith('data:image')){w.document.write(`<html><head><title>${f.name}</title><style>body{margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh;background:#0a0a0f}</style></head><body><img src="${f.data}" style="max-width:95vw;max-height:95vh;border-radius:8px"></body></html>`)}else{w.document.write(`<html><head><title>${f.name}</title><style>body{margin:0;padding:2rem;background:#0a0a0f;color:#e2e8f0;font-family:monospace;white-space:pre-wrap;font-size:14px}</style></head><body></body></html>`);try{const text=atob(f.data.split(',')[1]);w.document.body.textContent=text}catch{w.close();downloadFile(day,idx)}}}
function downloadFile(day,idx){const n=getNotes();const f=n[day]?.[idx];if(!f)return;const a=document.createElement('a');a.href=f.data;a.download=f.name;a.click()}
function showFileOptions(day,idx){const n=getNotes();const f=n[day]?.[idx];if(!f)return;const isPdf=f.type==='application/pdf'||f.name.endsWith('.pdf');const isImg=f.data.startsWith('data:image');const isText=['js','ts','py','html','css','json','sql','md','txt','csv','xml','yaml','yml','sh','env','log'].includes((f.name.split('.').pop()||'').toLowerCase());const canPreview=isPdf||isImg||isText;showCele(`<div class="cele-emoji">${fileIcon(f.name)}</div><div class="cele-title" style="font-size:1rem">${f.name}</div><div class="cele-sub">${fmtSize(f.size)} \xB7 ${f.type||'unknown type'} \xB7 ${new Date(f.ts).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}</div><div style="display:flex;gap:0.5rem;flex-wrap:wrap;justify-content:center;margin-top:0.5rem">${canPreview?`<button class="cele-btn" onclick="closeCele();openFileInBrowser(${day},${idx})" style="background:var(--accent)">\u{1F310} Open in Browser</button>`:''}<button class="cele-btn" onclick="closeCele();downloadFile(${day},${idx})" style="background:var(--accent2)">\u{2B07}\uFE0F Download</button><button class="cele-btn" onclick="closeCele();showArtemis(${day})" style="background:transparent;border:1px solid var(--border);color:var(--text-dim)">Back</button></div>`)}

function showArtemis(day){const a=artemisMap[day];if(!a)return;const it=C.find(c=>c.d===day);const sk=skillMap[day]||'';const files=getFilesForDay(day);const locked=!isUnlocked();
const filesHtml=files.length?files.map((f,i)=>`<div class="note-item" onclick="showFileOptions(${day},${i})"><div class="note-icon">${fileIcon(f.name)}</div><div class="note-info"><div class="note-name">${f.name}</div><div class="note-meta">${fmtSize(f.size)} \xB7 ${new Date(f.ts).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</div></div>${locked?'':`<div class="note-actions"><button class="note-btn del" onclick="event.stopPropagation();removeFile(${day},${i})" title="Remove">\u2716</button></div>`}</div>`).join(''):`<div class="note-empty">No files attached yet.</div>`;
const uploadHtml=locked?'':`<div class="note-upload-row"><label class="note-upload-label">\u{1F4CE} Attach Files<input type="file" multiple hidden onchange="handleFileUpload(${day},this)"></label><span class="note-upload-hint">PDFs, images, code, screenshots</span></div>`;
showCele(`<div class="cele-emoji">\u{1F3E2}</div><div class="cele-title" style="font-size:1.1rem">Day ${day}: ${it.t}</div><div class="cele-sub">${it.s} \xB7 ${it.dur}</div><div class="cele-skills"><div class="cele-skills-title" style="color:var(--p4)">\u{1F50C} How This Helps ArtemisAI</div><div class="cele-skill-item">${a}</div></div><div class="cele-skills"><div class="cele-skills-title">\u{1F513} Skill You'll Unlock</div><div class="cele-skill-item"><span>\u2713</span> ${sk}</div></div><div class="notes-sec"><div class="notes-title">\u{1F4CE} Attachments</div><div class="notes-list">${filesHtml}</div>${uploadHtml}</div><div style="margin-top:0.6rem"><a href="${it.l}" target="_blank" style="display:inline-block;background:var(--accent);color:var(--bg);border:none;border-radius:10px;padding:0.5rem 1.2rem;font-family:Syne,sans-serif;font-weight:700;font-size:0.7rem;text-decoration:none;cursor:pointer">\u25B6 Go to Video</a> <button class="cele-btn" onclick="closeCele()" style="margin-left:0.5rem">Close</button></div>`)}

function showProjectGuide(id){const g=projectGuides[id];if(!g)return;showCele(`<div class="cele-emoji">\u{1F6E0}\uFE0F</div><div class="cele-title" style="font-size:1.1rem">${g.title}</div><div class="cele-skills"><div class="cele-skills-title">Implementation Steps</div>${g.steps.map(s=>`<div class="cele-skill-item">${s}</div>`).join('')}</div><button class="cele-btn" onclick="closeCele()">Let's Build</button>`)}

function prj(){const pr=ld(SK,{}),pace=getPace(),rem=C.filter(c=>!pr[c.d]).length,dn=Math.ceil(rem/pace),ed=new Date();ed.setDate(ed.getDate()+dn);return{rem,dn,ed,pace}}

// SOUND
const AC=typeof AudioContext!=='undefined'?new AudioContext():null;
function noise(dur,vol){if(!AC)return;const buf=AC.createBuffer(1,AC.sampleRate*dur,AC.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*vol;const s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();s.buffer=buf;f.type='bandpass';f.frequency.value=3000;f.Q.value=0.5;s.connect(f);f.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(vol,AC.currentTime);g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);s.start();s.stop(AC.currentTime+dur)}
function playCheer(){if(AC)AC.resume();noise(1.2,0.15);if(!AC)return;[880,1100,1320].forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.connect(g);g.connect(AC.destination);o.frequency.value=f;g.gain.setValueAtTime(0,AC.currentTime+i*0.05);g.gain.linearRampToValueAtTime(0.08,AC.currentTime+i*0.05+0.03);g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+i*0.05+0.3);o.start(AC.currentTime+i*0.05);o.stop(AC.currentTime+i*0.05+0.3)})}
function playFanfare(){if(AC)AC.resume();noise(1.5,0.12);if(!AC)return;[523,587,659,784,880,1047].forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=i%2?'sine':'triangle';o.connect(g);g.connect(AC.destination);o.frequency.value=f;g.gain.setValueAtTime(0,AC.currentTime+i*0.13);g.gain.linearRampToValueAtTime(0.15,AC.currentTime+i*0.13+0.04);g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+i*0.13+0.5);o.start(AC.currentTime+i*0.13);o.stop(AC.currentTime+i*0.13+0.5)})}
function playGrand(){if(AC)AC.resume();noise(2,0.15);if(!AC)return;[523,659,784,880,1047,1175,1319,1568].forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=i<4?'triangle':'sine';o.connect(g);g.connect(AC.destination);o.frequency.value=f;g.gain.setValueAtTime(0,AC.currentTime+i*0.1);g.gain.linearRampToValueAtTime(0.12,AC.currentTime+i*0.1+0.03);g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+i*0.1+0.7);o.start(AC.currentTime+i*0.1);o.stop(AC.currentTime+i*0.1+0.7)});setTimeout(()=>noise(1,0.08),800)}

const cCv=document.getElementById('confetti'),cCx=cCv.getContext('2d');let parts=[],cAn=null;
function rC(){cCv.width=innerWidth;cCv.height=innerHeight}addEventListener('resize',rC);rC();
function launchConfetti(n=80){const cols=['#00f0ff','#7b61ff','#ff6b9d','#00e676','#ffd700','#ff6b35'];for(let i=0;i<n;i++)parts.push({x:Math.random()*cCv.width,y:cCv.height+10,vx:(Math.random()-0.5)*8,vy:-(Math.random()*15+8),sz:Math.random()*6+3,c:cols[~~(Math.random()*cols.length)],r:Math.random()*360,rs:(Math.random()-0.5)*10,g:0.25,life:1,dc:Math.random()*0.01+0.005,sh:Math.random()>0.5});if(!cAn)animC()}
function animC(){cCx.clearRect(0,0,cCv.width,cCv.height);parts=parts.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.r+=p.rs;p.life-=p.dc;if(p.life<=0)return false;cCx.save();cCx.translate(p.x,p.y);cCx.rotate(p.r*Math.PI/180);cCx.globalAlpha=p.life;cCx.fillStyle=p.c;p.sh?cCx.fillRect(-p.sz/2,-p.sz/2,p.sz,p.sz*0.6):(cCx.beginPath(),cCx.arc(0,0,p.sz/2,0,Math.PI*2),cCx.fill());cCx.restore();return true});parts.length?cAn=requestAnimationFrame(animC):(cCx.clearRect(0,0,cCv.width,cCv.height),cAn=null)}

// CELEBRATIONS
function showCele(h){document.getElementById('celeBox').innerHTML=h;document.getElementById('celeOverlay').classList.add('show')}
function closeCele(){document.getElementById('celeOverlay').classList.remove('show')}
document.getElementById('celeOverlay').onclick=e=>{if(e.target===e.currentTarget)closeCele()};
function sessionCele(day){playCheer();launchConfetti(35);const sk=skillMap[day]||'New skill unlocked!',it=C.find(c=>c.d===day);showCele(`<div class="cele-emoji">\u{2705}</div><div class="cele-title">Session ${day} Done!</div><div class="cele-sub">${it.t}</div><div class="cele-skills"><div class="cele-skills-title">\u{1F513} Skill Unlocked</div><div class="cele-skill-item"><span>\u2713</span> ${sk}</div></div><button class="cele-btn" onclick="closeCele()">Keep Going</button>`)}
function phaseCele(phase){playFanfare();launchConfetti(120);const ps=phaseSkills[phase];showCele(`<div class="cele-emoji">${PI[phase].i}\u{1F389}</div><div class="cele-title">${ps.title}</div><div class="cele-skills"><div class="cele-skills-title">\u{1F4AA} You Can Now</div>${ps.skills.map(s=>`<div class="cele-skill-item"><span>\u2713</span> ${s}</div>`).join('')}</div><div class="cele-skills"><div class="cele-skills-title" style="color:var(--accent3)">\u{1F6E0}\uFE0F What You Can Build</div>${ps.build.map(b=>`<div class="cele-skill-item"><span>\u{1F680}</span> ${b}</div>`).join('')}</div><button class="cele-btn" onclick="closeCele()">Let's Go!</button>`);setTimeout(()=>launchConfetti(80),600);setTimeout(()=>launchConfetti(60),1200)}
function grandCele(){playGrand();launchConfetti(200);showCele(`<div class="cele-emoji" style="font-size:4rem">\u{1F3C6}\u{1F451}\u{1F389}</div><div class="cele-title" style="font-size:1.8rem">ALL 53 SESSIONS DONE!</div><div class="cele-sub">Asad, you legend.<br>LLMs \u2192 Fine-tuning \u2192 All RAG Types \u2192 Agents \u2192 MCP \u2192 Claude Agents \u2192 A2A<br><strong>4 projects. 53 sessions. Zero fluff.</strong></div><button class="cele-game-btn" onclick="closeCele();openGame()">\u{1F3AE} Claim Reward: Neural Net Catcher</button><br><button class="cele-btn" onclick="closeCele()" style="margin-top:0.5rem;background:transparent;border:1px solid var(--border);color:var(--text-dim)">Close</button>`);setTimeout(()=>launchConfetti(150),700);setTimeout(()=>launchConfetti(120),1400)}
function giftPopup(phase){const ps=phaseSkills[phase],pr=ld(SK,{}),items=C.filter(c=>c.p===phase),dn=items.filter(c=>pr[c.d]).length,unlocked=dn>=items.length;
if(unlocked)showCele(`<div class="cele-emoji">${PI[phase].i}\u{1F381}</div><div class="cele-title">${ps.title}</div><div class="cele-skills"><div class="cele-skills-title">\u{1F4AA} Skills Unlocked</div>${ps.skills.map(s=>`<div class="cele-skill-item"><span>\u2713</span> ${s}</div>`).join('')}</div><div class="cele-skills"><div class="cele-skills-title" style="color:var(--accent3)">\u{1F6E0}\uFE0F What You Can Build</div>${ps.build.map(b=>`<div class="cele-skill-item"><span>\u{1F680}</span> ${b}</div>`).join('')}</div><button class="cele-btn" onclick="closeCele()">Nice!</button>`);
else showCele(`<div class="cele-emoji">\u{1F512}</div><div class="cele-title">${PI[phase].n}</div><div class="cele-sub">Complete ${items.length-dn} more sessions to unlock!</div><div class="cele-skills"><div class="cele-skills-title" style="color:var(--text-dim)">\u{1F381} Rewards Waiting</div>${ps.skills.map(s=>`<div class="cele-skill-item" style="opacity:0.4">\u{1F512} ${s}</div>`).join('')}</div><button class="cele-btn" onclick="closeCele()">Back to work</button>`)}

function tog(d){requireAuth(()=>{const p=ld(SK,{});const wasOff=!p[d];if(p[d])delete p[d];else p[d]=Date.now();sv(SK,p);
if(wasOff){const np=ld(SK,{}),allDn=C.filter(c=>np[c.d]).length,item=C.find(c=>c.d===d),pIt=C.filter(c=>c.p===item.p),pDn=pIt.filter(c=>np[c.d]).length;allDn===TOT?grandCele():pDn===pIt.length?phaseCele(item.p):sessionCele(d)}render()})}
function saveLink(id){requireAuth(()=>{const v=document.getElementById('input-'+id).value.trim();if(!v)return;const l=ld(LK,{});const isNew=!l[id];l[id]=v;sv(LK,l);render();
if(isNew){playFanfare();launchConfetti(100);showCele(`<div class="cele-emoji">\u{1F680}\u{2728}</div><div class="cele-title">Project Shipped!</div><div class="cele-sub">Real work > certificates.</div><button class="cele-btn" onclick="closeCele()">Back to it</button>`);setTimeout(()=>launchConfetti(60),500)}})}
function setF(f){af=f;render()}
function togC(p){cs[p]=!cs[p];sv(CK,cs);render()}
function removeLink(id){requireAuth(()=>{const l=ld(LK,{});delete l[id];sv(LK,l);render()})}
function resetAll(){requireAuth(()=>{if(confirm('Reset all progress?')){localStorage.removeItem(SK);localStorage.removeItem(LK);render()}})}

function render(){
const pr=ld(SK,{}),td=dayNum(),tot=TOT,done=C.filter(c=>pr[c.d]).length;
const pj=prj(),pace=getPace(),links=ld(LK,{});
const pd=[1,2,3,4].map(p=>{const it=C.filter(c=>c.p===p);return{it,dn:it.filter(c=>pr[c.d]).length}});
const streakDays=(()=>{let s=0;for(let i=td-1;i>=1;i--){if(pr[i])s++;else break}return s})();
document.getElementById('lockBanner').classList.toggle('show',!isUnlocked());

document.getElementById('greeting').innerHTML=`<h1><span class="name">Asad's GenAI Journey</span></h1>
<div class="tagline">${getGreeting()} \xB7 ${tot} sessions \xB7 LLMs \u2192 RAG \u2192 Agents \u2192 MCP</div>
<div class="motivation">${done===0?`53 sessions. No fluff. Concept videos + hands-on courses + 4 projects. <span>Day 1: Karpathy's Deep Dive. Let's go.</span>`:done>=tot?`<span>All ${tot} sessions done.</span> 3 projects shipped. You're an AI engineer now.`:streakDays>=3?`<span>${streakDays}-day streak \u{1F525}</span> ${pj.rem} left. Done by ${fmt(pj.ed)}.`:`${done} down, ${pj.rem} to go. Finishing by <span>${fmt(pj.ed)}</span>.`}</div>`;

document.getElementById('statsBar').innerHTML=`<div class="stat-card"><div class="stat-label">Done</div><div class="stat-value cw">${done}/${tot}</div></div><div class="stat-card"><div class="stat-label">How AI Works</div><div class="stat-value c1">${pd[0].dn}/${pd[0].it.length}</div></div><div class="stat-card"><div class="stat-label">LLM Mastery</div><div class="stat-value c2">${pd[1].dn}/${pd[1].it.length}</div></div><div class="stat-card"><div class="stat-label">RAG Types</div><div class="stat-value c3">${pd[2].dn}/${pd[2].it.length}</div></div><div class="stat-card"><div class="stat-label">Agents+MCP</div><div class="stat-value c4">${pd[3].dn}/${pd[3].it.length}</div></div>`;

const s0=new Date(SD+'T00:00:00'),tSpan=Math.max((pj.ed-s0)/864e5,1),el=Math.max((new Date()-s0)/864e5,0),pPct=Math.min((done/tot)*100,100),tPct=Math.min((el/tSpan)*100,100);
const giftPositions=[10/tot*100,25/tot*100,37/tot*100,99];
document.getElementById('tlSection').innerHTML=`<div class="tl-card"><div class="tl-top"><div class="tl-title">Timeline</div><div class="tl-dates"><span>${fmt(s0)}</span> \u2192 <span>${fmt(pj.ed)}</span></div></div><div class="meter"><div class="meter-fill" style="width:${pPct}%"></div><div class="meter-today" style="left:${tPct}%"></div></div><div class="meter-gifts">${[1,2,3,4].map((p,i)=>`<div class="meter-gift ${pd[i].dn>=pd[i].it.length?'':'locked'}" style="left:${giftPositions[i]}%" onclick="giftPopup(${p})">\u{1F381}</div>`).join('')}</div><div class="tl-stats"><div class="ts"><div class="ts-v cg">${done}</div><div class="ts-l">Done</div></div><div class="ts"><div class="ts-v c1">${pj.rem}</div><div class="ts-l">Left</div></div><div class="ts"><div class="ts-v c3">${pj.dn}</div><div class="ts-l">Days</div></div><div class="ts"><div class="ts-v c2">${fmt(pj.ed)}</div><div class="ts-l">Finish</div></div><div class="ts"><div class="ts-v cg">${Math.round(pPct)}%</div><div class="ts-l">Complete</div></div></div></div>`;

document.getElementById('paceSection').innerHTML=`<div class="pace-card"><div class="pace-top"><div class="pace-title">\u26A1 Daily Pace</div><div class="pace-val">${pace} session${pace>1?'s':''}/day</div></div><input type="range" min="1" max="5" value="${pace}" oninput="setPace(+this.value)"><div class="pace-chips"><div class="pchip"><strong>${pj.dn}</strong><span>days left</span></div><div class="pchip"><strong>${pj.rem}hr</strong><span>total</span></div><div class="pchip"><strong>${pace}hr</strong><span>per day</span></div><div class="pchip"><strong>${fmt(pj.ed)}</strong><span>finish</span></div></div><div class="milestones">${[1,2,3,4].map((p,i)=>`<div class="gift ${pd[i].dn>=pd[i].it.length?'unlocked':'locked'}" onclick="giftPopup(${p})">\u{1F381} P${p}</div>`).join('')}<div class="gift ${done>=tot?'unlocked':'locked'}" onclick="${done>=tot?'openGame()':'giftPopup(4)'}">\u{1F3AE} Game</div></div></div>`;

document.getElementById('progTrack').innerHTML=pd.map((p,i)=>`<div class="prog-fill" style="width:${(p.dn/tot)*100}%;background:var(--p${i+1})"></div>`).join('');

const undone=C.filter(c=>!pr[c.d]),todayS=undone.slice(0,pace),hEl=document.getElementById('heroSection');
if(todayS.length){const f=todayS[0],pi=PI[f.p];hEl.innerHTML=`<div class="hero-card"><div class="hero-badge">${pace>1?todayS.length+' TODAY':'TODAY'}</div><div class="hero-phase">${pi.i} ${pi.n}</div><div class="hero-title">Day ${f.d}: ${f.t}</div><div class="hero-dur">${f.s} \xB7 ${f.dur}</div><a href="${f.l}" target="_blank" class="hero-link">\u25B6 Start Session</a>${todayS.length>1?`<div class="hero-extra">${todayS.slice(1).map(x=>`<div class="hero-extra-item"><div class="mini-ck ${pr[x.d]?'on':''}" onclick="event.stopPropagation();tog(${x.d})">${pr[x.d]?'\u2713':''}</div><a href="${x.l}" target="_blank">Day ${x.d}: ${x.t}</a></div>`).join('')}</div>`:''}</div>`}
else hEl.innerHTML=`<div class="hero-card"><div class="hero-badge">COMPLETE</div><div style="color:var(--text-dim);font-size:0.8rem;padding:0.3rem 0">\u{1F389} All ${tot} sessions done. Legendary, Asad.</div></div>`;

document.getElementById('showcase').innerHTML=`<div class="showcase-title">\u{1F680} Project Showcase</div><div class="showcase-grid">${projects.map(pj=>{const link=links[pj.id]||'';return`<div class="project-card ${link?'has-link':''}"><div class="pc-phase c${pj.phase}">${PI[pj.phase].i} ${PI[pj.phase].n}</div><div class="pc-name">${pj.name}</div><div class="pc-desc">${pj.desc}</div><button class="pc-guide" onclick="showProjectGuide('${pj.id}')">\u{1F6E0}\uFE0F How to Build This</button><div class="pc-input-row"><input class="pc-input" id="input-${pj.id}" placeholder="${pj.placeholder}" value="${link}"><button class="pc-save" onclick="saveLink('${pj.id}')">Save Link</button></div>${link?`<div class="pc-saved-link"><a href="${link}" target="_blank">\u2713 ${link}</a><button class="pc-remove" onclick="removeLink('${pj.id}')">remove</button></div>`:''}</div>`}).join('')}</div>`;

document.getElementById('filters').innerHTML=['all',1,2,3,4].map(f=>{const lb=f==='all'?'All':`P${f}`;return`<button class="fbtn ${af===f?'on':''}" onclick="setF(${typeof f==='string'?"'"+f+"'":f})">${lb}</button>`}).join('');

const phs=af==='all'?[1,2,3,4]:[af];
document.getElementById('phases').innerHTML=phs.map(p=>{const pi=PI[p],items=C.filter(c=>c.p===p),dn=items.filter(c=>pr[c.d]).length,col=cs[p];
return`<div class="phase-sec"><div class="ph-hdr" onclick="togC(${p})"><div class="ph-dot p${p}"></div><div class="ph-name">${pi.i} ${pi.n}</div><div class="ph-cnt">${dn}/${items.length}</div><div class="ph-tog ${col?'collapsed':''}">\u25BC</div></div><div class="days ${col?'collapsed':''}" style="${col?'max-height:0':'max-height:99999px'}">${items.map(it=>{const isDn=pr[it.d],isT=it.d===td;return`<div class="di ${isDn?'done':''} ${isT?'today':''}" onclick="showArtemis(${it.d})"><div class="ck ${isDn?'on':''}" onclick="event.stopPropagation();tog(${it.d})">${isDn?'\u2713':''}</div><div class="d-info"><div class="dt">Day ${it.d}: ${it.t}</div><div class="dm">${it.s} \xB7 ${it.dur}${(getNotes()[it.d]||[]).length?' \xB7 \u{1F4CE}'+getNotes()[it.d].length:''}</div></div><button class="d-artemis" onclick="event.stopPropagation();showArtemis(${it.d})" title="Show details">\u{1F4CB}</button><a href="${it.l}" target="_blank" class="d-arrow" onclick="event.stopPropagation()" title="Go to video">\u25B6</a></div>`}).join('')}</div></div>`}).join('');

document.getElementById('streakGrid').innerHTML=C.map(c=>{const isDn=pr[c.d],isT=c.d===td,isF=c.d>td;let cls='sd';if(isDn)cls+=' done';else if(isT)cls+=' today';else if(isF)cls+=' future';return`<div class="${cls}" data-tip="Day ${c.d}: ${c.t}"></div>`}).join('');
}

// GAME
let gameRunning=false;
function openGame(){document.getElementById('gameModal').classList.add('show');startGame()}
function closeGame(){document.getElementById('gameModal').classList.remove('show');gameRunning=false}
function startGame(){const gc=document.getElementById('gameCanvas'),ctx=gc.getContext('2d'),W=gc.width,H=gc.height;let score=0;gameRunning=true;let paddle={x:W/2-30,w:60,h:10},items=[],frame=0,speed=2;const em=['\u{1F9E0}','\u{1F525}','\u{1F50D}','\u{1F916}','\u26A1','\u{2B50}'],bad=['\u{1F4A3}','\u{1F480}'];
gc.onmousemove=e=>{const r=gc.getBoundingClientRect();paddle.x=((e.clientX-r.left)/r.width)*W-paddle.w/2};
gc.ontouchmove=e=>{e.preventDefault();const r=gc.getBoundingClientRect();paddle.x=((e.touches[0].clientX-r.left)/r.width)*W-paddle.w/2};
function loop(){if(!gameRunning)return;ctx.fillStyle='#0a0a0f';ctx.fillRect(0,0,W,H);ctx.strokeStyle='rgba(0,240,255,0.05)';for(let i=0;i<W;i+=20){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,H);ctx.stroke()}for(let i=0;i<H;i+=20){ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(W,i);ctx.stroke()}
frame++;if(frame%30===0){const b=Math.random()<0.2;items.push({x:Math.random()*(W-20),y:-20,e:b?bad[~~(Math.random()*bad.length)]:em[~~(Math.random()*em.length)],b,sp:speed+Math.random()*1.5})}if(frame%300===0)speed+=0.3;
items=items.filter(it=>{it.y+=it.sp;ctx.font='20px serif';ctx.fillText(it.e,it.x,it.y);if(it.y>H-paddle.h-5&&it.y<H&&it.x>paddle.x-10&&it.x<paddle.x+paddle.w+10){it.b?score=Math.max(0,score-5):score++;return false}return it.y<H+30});
const gr=ctx.createLinearGradient(paddle.x,0,paddle.x+paddle.w,0);gr.addColorStop(0,'#00f0ff');gr.addColorStop(0.5,'#7b61ff');gr.addColorStop(1,'#ff6b9d');ctx.fillStyle=gr;ctx.beginPath();ctx.roundRect(paddle.x,H-paddle.h-5,paddle.w,paddle.h,5);ctx.fill();
ctx.fillStyle='#e8e8f0';ctx.font='bold 14px Syne,sans-serif';ctx.fillText('Score: '+score,10,25);document.getElementById('gameScore').textContent='Score: '+score;requestAnimationFrame(loop)}loop()}
render();
</script>
</body>
</html>
